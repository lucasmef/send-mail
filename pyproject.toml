[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "send-mailqueue"
version = "0.1.0"
description = "Fila local de e-mails para macOS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dkimpy==1.1.8",
    "certifi==2026.7.22",
    "keyring==25.6.0",
]

[project.scripts]
mailqueue = "mailqueue.cli:main"

[dependency-groups]
build = [
    "hatchling==1.27.0",
]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mailqueue"]
